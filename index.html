<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterviewOps | AI-powered SRE Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/devchauhann/fonts@v1.1.0/cdn/api/css?family=AnthropicSans&weights=400;500;600;700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'light';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        const fonts = {
          'anthropic-serif': "'Anthropic Serif', ui-serif, Georgia, serif",
          'anthropic-sans': "'Anthropic Sans', ui-sans-serif, system-ui, sans-serif",
          'system-ui': 'ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif',
          'dyslexic-friendly': "'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif",
          'atkinson-hyperlegible': "'Atkinson Hyperlegible', ui-sans-serif, system-ui, sans-serif"
        };
        const stored = localStorage.getItem('reading-font');
        const id = stored === 'atkinson-hyperlegible' ? 'dyslexic-friendly' : (stored && fonts[stored] ? stored : 'anthropic-sans');
        document.documentElement.dataset.readingFont = id;
        document.documentElement.style.setProperty('--app-reading-font', fonts[id]);
      })();
    </script>
    <style>
      body {
        font-family: var(--app-reading-font);
      }
      pre, code, .font-mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace !important;
      }
    </style>
  </head>
  <body class="h-full bg-zinc-50 text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 transition-colors duration-150">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
